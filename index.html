<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SKIN UPLOADER UTILITY v1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace;
        }

        body {
            background-color: #d4ceb8; /* Classic 90s warm beige desktop */
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 90s Utility Window Frame */
        .window {
            background-color: #eae5d9; /* Off-white / light beige panel */
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #7a7565;
            border-bottom: 2px solid #7a7565;
            padding: 4px;
            width: 340px;
            box-shadow: 2px 2px 0px #000000;
        }

        /* Classic Title Bar */
        .title-bar {
            background-color: #8f8875;
            color: #ffffff;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .window-body {
            padding: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* Inset 3D Text Field */
        input[type="text"] {
            width: 100%;
            padding: 6px;
            background-color: #ffffff;
            border-top: 2px solid #7a7565;
            border-left: 2px solid #7a7565;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            color: #000000;
            font-size: 0.9rem;
            outline: none;
            border-radius: 0; /* Strict square corners */
        }

        input[type="file"] {
            width: 100%;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        /* Raised 3D Button */
        button {
            width: 100%;
            padding: 8px;
            background-color: #eae5d9;
            color: #000000;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            border-radius: 0;
        }

        button:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 9px 7px 7px 9px; /* Simulates physical press */
        }

        /* Status Box */
        #status {
            margin-top: 14px;
            font-size: 0.75rem;
            padding: 6px;
            background-color: #d4ceb8;
            border-top: 1px solid #7a7565;
            border-left: 1px solid #7a7565;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            min-height: 28px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">SKIN_UPLOAD.EXE</div>
        <div class="window-body">
            
            <div class="form-group">
                <label for="username">> USERNAME:</label>
                <input type="text" id="username" placeholder="Player1" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="skinFile">> SELECT FILE (.PNG):</label>
                <input type="file" id="skinFile" accept=".png">
            </div>

            <button onclick="uploadSkin()">[ UPLOAD SKIN ]</button>

            <div id="status">READY.</div>
        </div>
    </div>

<script>
async function uploadSkin() {
    const user = document.getElementById('username').value.trim().toLowerCase();
    const fileInput = document.getElementById('skinFile');
    const status = document.getElementById('status');

    if (!user || !fileInput.files[0]) {
        status.innerText = "ERROR: MISSING USERNAME OR FILE";
        return;
    }

    status.innerText = "UPLOADING...";
    const reader = new FileReader();

    reader.onload = async function() {
        const base64Content = reader.result.split(',')[1];
        
        const repo = "ratzcool555-max/skins";
        const path = `${user}.png`;
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Uploaded skin for ${user}`,
                    content: base64Content
                })
            });

            if (response.ok || response.status === 422) {
                status.innerText = `OK: '${user}.png' READY IN GAME.`;
            } else {
                status.innerText = "ERROR: UPLOAD FAILED";
            }
        } catch (err) {
            status.innerText = "ERROR: SERVER UNREACHABLE";
        }
    };

    reader.readAsDataURL(fileInput.files[0]);
}
</script>
</body>
</html>
